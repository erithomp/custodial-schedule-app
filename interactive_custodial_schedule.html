<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMAC Interactive Custodial Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Calm Harmony -->
    <!-- Application Structure Plan: The SPA is designed as a "Daily Task View" dashboard. This structure was chosen to transform the static, dense spreadsheet into a user-centric tool. The user's primary goal is to know "What do I need to do today?". The layout features a persistent weekly navigation on the left (desktop) or top (mobile), allowing users to easily switch between days, and a dynamic main content area that displays the selected day's schedule. This is more intuitive than scrolling through a long document. The schedule is broken down into time-blocked, interactive cards, making the information digestible and actionable. This design prioritizes immediate clarity and task management over a simple chronological display. -->
    <!-- Visualization & Content Choices: Report Info -> Goal -> Viz/Presentation -> Interaction -> Justification. 1. Daily/Weekly Tasks -> Organize/Inform -> Interactive Task Cards with Checklists -> Click to check/uncheck -> Provides a sense of accomplishment and clear tracking of completed work. Color-coded borders on deep clean cards provide quick visual association with the zone. 2. Weekly Deep Clean Progress -> Engage/Motivate -> Donut Chart (Chart.js/Canvas) -> Chart updates on checkbox click -> Offers a "wow factor" and visual feedback on progress towards the weekly goal, making the work more engaging. 3. Schedule Navigation -> Navigate -> Day Selector Buttons -> Click to update view -> A simple, intuitive method for a recurring weekly schedule, superior to a full calendar for this specific use case. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        .task-card {
            border-left-width: 4px;
            transition: all 0.3s ease;
        }
        .nav-button {
            transition: all 0.3s ease;
        }
        .nav-button.active {
            background-color: #4338ca; /* indigo-700 */
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .task-checkbox:checked + label {
            text-decoration: line-through;
            color: #6b7280; /* gray-500 */
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 250px;
            margin-left: auto;
            margin-right: auto;
            height: 250px;
            max-height: 250px;
        }
        .gemini-button {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            transition: background-color 0.3s ease;
        }
        .gemini-button:hover {
            background-color: #4338ca; /* indigo-700 */
        }
        .spinner {
            border: 2px solid rgba(0, 0, 0, 0.1);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .collapsible-content {
            transition: max-height 0.5s ease-in-out, visibility 0.5s ease-in-out;
            max-height: 1000px; /* arbitrary large value */
            overflow: hidden;
            visibility: visible;
        }
        .collapsible-content.collapsed {
            max-height: 0;
            visibility: hidden;
        }
    </style>
</head>

        async function callGeminiAPI(prompt, button) {
            const buttonText = button.querySelector('.btn-text');
            const spinner = button.querySelector('.spinner');

            // --- PASTE YOUR GOOGLE GEMINI API KEY HERE ---
            const apiKey = "";
            // ---------------------------------------------

            if (!apiKey) {
                return "AI features are disabled. Please add your Google Gemini API key to the script.";
            }

            buttonText.classList.add('hidden');
            spinner.classList.remove('hidden');
            button.disabled = true;

            // Using a recommended model. For a full list of models, see: https://ai.google.dev/models/gemini
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };

            let responseText = "Sorry, I couldn't get a response. Please check your connection and API key, then try again.";

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                     throw new Error(`API request failed with status ${response.status}: ${await response.text()}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    responseText = candidate.content.parts[0].text.replace(/\n/g, '<br>');
                } else if (result.error) {
                    console.error("Gemini API Error:", result.error.message);
                    responseText = `An API error occurred: ${result.error.message}`;
                }

            } catch (error) {
                console.error("Gemini API call failed:", error);
            } finally {
                buttonText.classList.remove('hidden');
                spinner.classList.add('hidden');
                button.disabled = false;
            }
            return responseText;
        }

        safetyTipBtn.addEventListener('click', async () => {
            const prompt = "Provide one concise, actionable safety tip for a custodian working in an industrial or manufacturing facility. Focus on a common but important task like chemical handling, floor care, or equipment usage.";
            safetyTipResult.innerHTML = await callGeminiAPI(prompt, safetyTipBtn);
        });

        stainBtn.addEventListener('click', async () => {
            const stainDescription = stainInput.value.trim();
            if (!stainDescription) {
                stainResult.textContent = "Please describe the stain first.";
                return;
            }
            const prompt = `I am a custodian in a facility. I need to clean a stain. Here is the description: "${stainDescription}". Provide me with a safe and effective step-by-step cleaning procedure. Include any safety warnings for chemicals.`;
            stainResult.innerHTML = await callGeminiAPI(prompt, stainBtn);
        });

        currentDateEl.textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        const totalDeepCleanTasks = Object.values(scheduleData)
            .flatMap(day => day.tasks)
            .filter(task => task.type === 'deep-clean')
            .reduce((acc, task) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(task.content, 'text/html');
                return acc + doc.querySelectorAll('.deep-clean-checkbox').length;
            }, 0);

        let progressChart;

        const updateChart = () => {
            const checkedCount = document.querySelectorAll('.deep-clean-checkbox:checked').length;
            const percentage = totalDeepCleanTasks > 0 ? (checkedCount / totalDeepCleanTasks) * 100 : 0;

            if (!progressChart) {
                const ctx = document.getElementById('progressChart').getContext('2d');
                progressChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Completed', 'Remaining'],
                        datasets: [{
                            data: [checkedCount, totalDeepCleanTasks - checkedCount],
                            backgroundColor: ['#4ade80', '#e5e7eb'],
                            borderColor: ['#ffffff'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: false },
                            title: {
                                display: true,
                                text: `${Math.round(percentage)}%`,
                                position: 'bottom',
                                align: 'center',
                                font: { size: 24, weight: 'bold' },
                                color: '#1e293b',
                                padding: { top: -60 }
                            }
                        }
                    }
                });
            } else {
                progressChart.data.datasets[0].data = [checkedCount, totalDeepCleanTasks - checkedCount];
                progressChart.options.plugins.title.text = `${Math.round(percentage)}%`;
                progressChart.update();
            }
        };

        const renderSchedule = (day) => {
            const data = scheduleData[day];
            if (!data) return;

            const scheduleClone = scheduleTemplate.content.cloneNode(true);
            scheduleClone.querySelector('[data-id="day-title"]').textContent = data.title;
            scheduleClone.querySelector('[data-id="shift-hours"]').textContent = data.shift;

            const taskContainer = scheduleClone.querySelector('[data-id="task-container"]');
            taskContainer.innerHTML = '';

            data.tasks.forEach(task => {
                const cardClone = taskCardTemplate.content.cloneNode(true);
                const cardElement = cardClone.querySelector('.task-card');
                cardElement.style.setProperty('--card-color', task.color);
                cardClone.querySelector('[data-id="card-icon"]').textContent = task.icon;
                cardClone.querySelector('[data-id="card-title"]').textContent = task.title;
                cardClone.querySelector('[data-id="card-content"]').innerHTML = task.content;
                taskContainer.appendChild(cardClone);
            });

            display.innerHTML = '';
            display.appendChild(scheduleClone);

            document.querySelectorAll('.deep-clean-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', updateChart);
            });
        };

        const handleNavClick = (e) => {
            if (e.target.tagName === 'BUTTON') {
                const day = e.target.dataset.day;

                navDesktop.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                navMobile.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));

                navDesktop.querySelector(`[data-day="${day}"]`).classList.add('active');
                navMobile.querySelector(`[data-day="${day}"]`).classList.add('active');

                renderSchedule(day);
            }
        };

        navDesktop.addEventListener('click', handleNavClick);
        navMobile.addEventListener('click', handleNavClick);

        dashboardToggle.addEventListener('click', () => {
            const isCollapsed = dashboardContent.classList.toggle('collapsed');
            toggleIcon.textContent = isCollapsed ? '▼' : '▲';
        });

        const today = new Date().getDay();
        const dayMap = [ 'sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const currentDayKey = dayMap[today];

        const todayButton = navDesktop.querySelector(`[data-day="${currentDayKey}"]`) || navDesktop.querySelector('[data-day="monday"]');
        if(todayButton) {
            todayButton.click();
        }

        updateChart();

        // Collapse dashboard by default on mobile
        if (window.innerWidth < 1024) {
            dashboardContent.classList.add('collapsed');
            toggleIcon.textContent = '▼';
        } else {
            toggleIcon.textContent = '▲';
        }
    });
</script>

</body>
</html>
